<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTOX | Modules scientifiques</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f5; color: #1f2933; }
.layout { display: flex; min-height: 100vh; }

.topline { color: #64748b; font-size: 13px; margin-bottom: 20px; }

  </nav>
</aside>
<main class="main">
  <div class="topline">SENTOX / Espace scientifique</div>
  <section class="panel">
    {% block content %}{% endblock %}
  </section>
</main>
</div>
</body>
